<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | EduManage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">EduManage</a>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="contact.html">Contact</a>
            </div>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="auth-intro">Join EduManage to start tracking students.</p>

            <form id="signupForm" action="https://formsubmit.co/isaacelliot92@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New EduManage Signup">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="success.html">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="Full Name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email Address" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
